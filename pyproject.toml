[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "face-emotion"
version = "0.1.0"
description = "Face and Emotion Detection"
requires-python = ">=3.10"
dependencies = [
    "tensorflow=1.9.0",
    "tf-keras",
    "opencv-python",
    "python-dotenv",
    "pandas",
    "numpy",
    "pillow",
    "ultralytics",
    "deepface",
    "pyinstaller",
    "protobuf == 6.31.1", # required for pillow ImageTK module and tensorflow, this version is compatible with both
    "scikit-learn",
    "seaborn",
    "gdown>=6.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
